[project]
name = "kicad-review"
version = "0.1.0"
description = "Schematic design review for KiCad: netlist rule checks plus a Claude review pass"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pydantic>=2", "anthropic>=0.80"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kicad-review = "kicad_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kicad_review"]
